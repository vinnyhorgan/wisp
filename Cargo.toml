[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
description = "what lite could really be"
repository = "https://github.com/vinnyhorgan/wisp"
license = "MIT"
# let-chains and std::io::pipe; edition 2024 alone would accept older
rust-version = "1.88"
# the binary runs against the data/ tree, not as a library
publish = false

[dependencies]
# lua 5.2 vendored: same interpreter lite shipped, the only c we compile
mlua = { version = "0.12", features = ["lua52", "vendored"] }
# pure-rust windowing and cpu-buffer presentation
winit = "0.30"
softbuffer = "0.4"
# hinted glyph rasterization, pure rust
swash = "0.2"
# clipboard, with wayland support
arboard = { version = "3", features = ["wayland-data-control"] }
# the data/ tree baked into the binary, unpacked on first run
include_dir = "0.7"
# png and jpeg decoding, pure rust all the way down
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
# safe wrapper for sigterm (process:terminate); compiles no c
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
# the single exception is documented in boot.rs (lua's debug library)
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
