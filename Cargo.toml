[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
description = "what lite could really be"
repository = "https://github.com/vinnyhorgan/wisp"
license = "MIT"
# let-chains and std::io::pipe; edition 2024 alone would accept older
rust-version = "1.88"
# the binary runs against the data/ tree, not as a library
publish = false

[dependencies]
# lua 5.5 vendored, the only c we compile (lite shipped 5.2; the
# migration and its data/ fallout are DEVIATIONS §13)
mlua = { version = "0.12", features = ["lua55", "vendored"] }
# pure-rust windowing and cpu-buffer presentation
winit = "0.30"
softbuffer = "0.4"
# hinted glyph rasterization, pure rust
swash = "0.2"
# clipboard, with wayland support
arboard = { version = "3", features = ["wayland-data-control"] }
# the data/ tree baked into the binary, unpacked on first run
include_dir = "0.7"
# png and jpeg decoding, pure rust all the way down
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# alacritty's vt engine and pty spawn -- the emulation, not the app.
# its event loop threads are deliberately unused (see src/terminal.rs)
alacritty_terminal = { version = "0.26", default-features = false }
# native fs events (inotify on linux, pure rust over the syscalls);
# its watcher thread stays inside the core, lua polls (src/watch.rs)
notify = "8.2"

[target.'cfg(unix)'.dependencies]
# safe wrappers for sigterm (process:terminate) and o_nonblock on the
# pty master (terminal); compiles no c
nix = { version = "0.29", features = ["signal", "fs"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
# the single exception is documented in boot.rs (lua's debug library)
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
